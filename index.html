<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 Your Magical Adventure Begins!</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #6dd5fa;
      --sunshine: #FFD93D;
      --coral: #FF6B6B;
      --mint: #6BCB77;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
    }

    /* ── LANDING SCREEN ── */
    #landing {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(109,213,250,0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(255,107,107,0.14) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 10%, rgba(255,217,61,0.10) 0%, transparent 40%),
        linear-gradient(135deg, #0a0a1a 0%, #0d1830 35%, #0a2a55 65%, #051535 100%);
    }

    /* Floating stars */
    .stars {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    .portal {
      position: relative;
      width: 200px;
      height: 200px;
      margin-bottom: 2.5rem;
      overflow: visible;
    }

    .dodu-logo {
      position: absolute;
      /* green ring is at inset:28px, so logo center = 100px from edge */
      /* scale up from center without touching the green ring */
      top: 50%;
      left: 50%;
      width: 199px;
      height: 199px;
      transform: translate(-50%, -50%);
      object-fit: contain;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(109,213,250,0.5)); }
      50% { filter: drop-shadow(0 0 28px rgba(109,213,250,0.9)) drop-shadow(0 0 45px rgba(255,217,61,0.5)); }
    }

    /* Canvas orbits replace old CSS rings */
    .portal-canvas {
      position: absolute;
      inset: -30px;
      width: calc(100% + 60px);
      height: calc(100% + 60px);
      pointer-events: none;
    }

    .landing-title {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: white;
      text-align: center;
      text-shadow: 0 2px 0 rgba(0,0,0,0.5), 0 4px 8px rgba(0,0,0,0.3);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      margin-bottom: 0.75rem;
      animation: float-title 3s ease-in-out infinite;
    }

    @keyframes float-title {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .landing-sub {
      font-size: 1.1rem;
      color: rgba(200,235,255,0.92);
      letter-spacing: 0.06em;
      margin-bottom: 2.5rem;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7), 0 0 18px rgba(109,213,250,0.35);
      -webkit-font-smoothing: antialiased;
    }

    .click-btn {
      padding: 1rem 2.5rem;
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      letter-spacing: 0.05em;
      color: #1a1a2e;
      background: linear-gradient(135deg, #FFE033 0%, #FFD93D 40%, #FF6B6B 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow:
        0 8px 32px rgba(255,107,107,0.55),
        0 4px 0 rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.5);

      transition: transform 0.15s, box-shadow 0.15s;
      animation: btn-bounce 2.5s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    .click-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent);
      border-radius: inherit;
    }

    @keyframes btn-bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .click-btn:hover {
      transform: scale(1.06) translateY(-2px);
      box-shadow: 0 14px 40px rgba(255,107,107,0.5), 0 4px 0 rgba(0,0,0,0.2);
    }

    .click-btn:active {
      transform: scale(0.97) translateY(1px);
    }
  </style>
</head>

    <h1 class="landing-title">🚀 Blast Off to Adventure!</h1>
    <p class="landing-sub">Dragons, rainbows & treasure await — are you brave enough? 🐉🌈</p>
    <button class="click-btn">🎉 Let's Go! 🎉</button>
  </div>

  <script>
    // Navigate to a random login page
    function navigate() {
      const pages = ['DoDU_LoginPage.html', 'DoDU_LoginPage1.html','DoDU_LoginPage2.html','DoDU_LoginPage3.html'];
      window.location.href = pages[Math.floor(Math.random() * pages.length)];
    }

    document.querySelector('.click-btn').addEventListener('click', navigate);
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') navigate();
    });

    // ── ORBIT CANVAS ANIMATION ──
    const canvas = document.getElementById('orbitCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width  = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    resizeCanvas();

    const cx = canvas.width  / 2;
    const cy = canvas.height / 2;

    // 3 orbit tracks
    const tracks = [
      { r: 112, color: '#FFD93D', shadowColor: 'rgba(255,217,61,',  count: 10, speed: 0.018, dotSize: 5,  trailLen: 14, offset: 0 },
      { r:  96, color: '#FF6B6B', shadowColor: 'rgba(255,107,107,', count: 8,  speed: -0.026, dotSize: 4, trailLen: 10, offset: 1 },
      { r:  80, color: '#6BCB77', shadowColor: 'rgba(107,203,119,', count: 6,  speed: 0.038, dotSize: 3.5, trailLen: 8, offset: 2 },
    ];

    // Each dot has angle, personal speed wobble, size pulse phase
    const dots = [];
    tracks.forEach((t, ti) => {
      for (let i = 0; i < t.count; i++) {
        dots.push({
          track: ti,
          angle: (i / t.count) * Math.PI * 2,
          speedMult: 0.75 + Math.random() * 0.5,   // each dot slightly different speed
          pulsePh: Math.random() * Math.PI * 2,      // size pulse offset
          trail: [],                                  // past positions
        });
      }
    });

    let frame = 0;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frame++;

      dots.forEach(d => {
        const t = tracks[d.track];

        // Advance angle — add gentle sine wave to speed for organic feel
        const speedWobble = t.speed * d.speedMult * (1 + 0.35 * Math.sin(frame * 0.03 + d.pulsePh));
        d.angle += speedWobble;

        const x = cx + Math.cos(d.angle) * t.r;
        const y = cy + Math.sin(d.angle) * t.r;

        // Store trail
        d.trail.push({ x, y });
        if (d.trail.length > t.trailLen) d.trail.shift();

        // Draw trail (fading dots)
        d.trail.forEach((pt, i) => {
          const alpha = (i / d.trail.length) * 0.55;
          const size  = t.dotSize * (i / d.trail.length) * 0.7;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, size, 0, Math.PI * 2);
          ctx.fillStyle = t.shadowColor + alpha + ')';
          ctx.fill();
        });

        // Pulsing dot size
        const pulse = t.dotSize + Math.sin(frame * 0.07 + d.pulsePh) * 1.2;

        // Outer glow
        const grd = ctx.createRadialGradient(x, y, 0, x, y, pulse * 3.5);
        grd.addColorStop(0,   t.shadowColor + '0.9)');
        grd.addColorStop(0.4, t.shadowColor + '0.4)');
        grd.addColorStop(1,   t.shadowColor + '0)');
        ctx.beginPath();
        ctx.arc(x, y, pulse * 3.5, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();

        // Bright core dot
        ctx.beginPath();
        ctx.arc(x, y, pulse, 0, Math.PI * 2);
        ctx.fillStyle = t.color;
        ctx.shadowColor = t.color;
        ctx.shadowBlur  = 10;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Sparkle cross on every 3rd dot
        if (d.track === 0 && Math.floor(d.angle * 3) % 7 === 0) {
          ctx.strokeStyle = t.color;
          ctx.lineWidth   = 1;
          ctx.globalAlpha = 0.6;
          ctx.beginPath();
          ctx.moveTo(x - pulse * 2.5, y); ctx.lineTo(x + pulse * 2.5, y);
          ctx.moveTo(x, y - pulse * 2.5); ctx.lineTo(x, y + pulse * 2.5);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      });

      requestAnimationFrame(draw);
    }

    draw();

    // Generate stars
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.cssText = `
        left: ${Math.random() * 100}%;
        top: ${Math.random() * 100}%;
        --dur: ${1.5 + Math.random() * 3}s;
        --delay: ${Math.random() * 3}s;
        width: ${1 + Math.random() * 3}px;
        height: ${1 + Math.random() * 3}px;
        opacity: ${0.1 + Math.random() * 0.9};
      `;
      starsEl.appendChild(s);
    }
  </script>
</body>
