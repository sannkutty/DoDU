<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* ════════════════════════════════
     SCREEN 3 — COLORING PAGE
  ════════════════════════════════ */
  #screen3 {
    background: #f0ede6;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  #screen3.active { display: flex; }

  /* TOP BAR */
  .topbar {
    display: flex;
    flex-direction: column;
    background: #f0ede6;
    border-bottom: 1px solid #d8d3ca;
    flex-shrink: 0;
  }
  .topbar-row1 {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 16px 2px;
    gap: 6px;
    font-size: 15px;
    font-weight: 800;
    color: #2d2d2d;
  }
  .topbar-row2 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 10px 6px;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tb-left { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .tb-right { display: flex; align-items: center; gap: 8px; }

  .back-btn {
    display: flex; align-items: center; gap: 4px;
    background: white; border: 1px solid #ccc; border-radius: 20px;
    padding: 4px 11px; font-size: 12px; font-weight: 700; cursor: pointer;
    color: #555; font-family: 'Nunito', system-ui, sans-serif;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .back-btn:hover { background: #f5f5f5; }

  .tool-btn {
    display: flex; align-items: center; gap: 4px;
    background: white; border: 1px solid #ccc; border-radius: 20px;
    padding: 4px 11px; font-size: 12px; font-weight: 700; cursor: pointer;
    color: #555; font-family: 'Nunito', system-ui, sans-serif;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .tool-btn:hover { background: #f5f5f5; }
  .tool-btn.active { background: #f97316; color: #fff; border-color: #f97316; }

  .size-control {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: #666; font-weight: 600;
    white-space: nowrap;
  }
  .size-control input[type=range] {
    width: 70px;
    accent-color: #f97316;
    cursor: pointer;
  }
  .size-num { font-weight: 800; color: #f97316; min-width: 18px; }
  .page-num { font-size: 12px; color: #999; font-weight: 700; white-space: nowrap; }

  /* CANVAS AREA — fills all remaining space */
  .canvas-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    min-height: 0;
    overflow: hidden;
  }

  .canvas-wrapper {
    background: white;
    border: 3px solid #1a1a1a;
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    /* Fill available space without overflowing — landscape for the coloring page */
    max-width: min(100%, calc((100vh - 160px) * 4 / 3));
    width: 100%;
    aspect-ratio: 4 / 3;
  }

  #colorCanvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    touch-action: none;
  }

  /* BOTTOM BAR — palette single row + nav */
  .bottom-bar {
    flex-shrink: 0;
    background: #f0ede6;
    border-top: 1px solid #d8d3ca;
    padding: 6px 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  /* Single-line scrollable palette */
  .palette-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
    scrollbar-color: #d8d3ca transparent;
    padding-bottom: 2px;
    width: 100%;
  }
  .palette-row::-webkit-scrollbar { height: 3px; }
  .palette-row::-webkit-scrollbar-track { background: transparent; }
  .palette-row::-webkit-scrollbar-thumb { background: #d8d3ca; border-radius: 10px; }

  .swatch {
    width: 26px; height: 26px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
    transition: transform 0.12s, border-color 0.12s;
    flex-shrink: 0;
  }
  .swatch:hover { transform: scale(1.2); }
  .swatch.selected { border-color: #1a1a1a; transform: scale(1.25); }
  .swatch.white-sw { border-color: #ccc; }
  .swatch.white-sw.selected { border-color: #555; }

  .rainbow-sw {
    width: 26px; height: 26px; border-radius: 50%;
    cursor: pointer; border: 2px solid #ccc;
    background: conic-gradient(red,#ff0,lime,aqua,blue,#f0f,red);
    flex-shrink: 0; transition: transform 0.12s;
    position: relative;
  }
  .rainbow-sw:hover { transform: scale(1.2); }
  .color-picker-input {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
    width: 100%; height: 100%; border-radius: 50%;
  }

  /* Nav row: Prev left, dots center, Save + Next right */
  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 6px;
  }
  .nav-btn {
    padding: 6px 16px; border-radius: 20px; font-size: 13px;
    cursor: pointer; border: 1px solid #ccc; background: white;
    color: #555; font-weight: 700; font-family: 'Nunito', system-ui, sans-serif;
    transition: background 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .nav-btn:hover:not(:disabled) { background: #f5f5f5; }
  .nav-btn.primary { background: #f97316; color: #fff; border-color: #f97316; }
  .nav-btn.primary:hover { background: #ea6c0a; }
  .nav-btn.save-btn { background: #22c55e; color: #fff; border-color: #22c55e; }
  .nav-btn.save-btn:hover { background: #16a34a; }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }

  .nav-center { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: center; }
  .page-dots { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 200px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; transition: all 0.2s; flex-shrink: 0; }
  .dot.active { background: #f97316; }

  .nav-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 600px) {
    .sidebar { width: 110px; }
    .s2-title { font-size: 16px; }
    .books-grid { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 10px; }
    .book-icon { font-size: 32px; }
    .swatch, .rainbow-sw { width: 22px; height: 22px; }
    .size-control input[type=range] { width: 55px; }
    .tool-btn, .back-btn { padding: 3px 8px; font-size: 11px; }
    .topbar-row1 { font-size: 13px; }
    .nav-btn { padding: 5px 12px; font-size: 12px; }
    .canvas-wrapper {
      max-width: min(100%, calc((100vh - 150px) * 4 / 3));
    }
  }

  @media (max-width: 400px) {
    .sidebar { width: 90px; }
    .side-btn { font-size: 11px; padding: 7px 4px; }
    .books-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
    .swatch, .rainbow-sw { width: 20px; height: 20px; }
    .tool-btn span.tool-label { display: none; }
    .nav-btn { padding: 4px 10px; font-size: 11px; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* Very short screens (landscape mobile) */
  @media (max-height: 500px) {
    .topbar-row1 { padding: 3px 16px 1px; font-size: 12px; }
    .topbar-row2 { padding: 1px 8px 4px; }
    .bottom-bar { padding: 4px 8px 5px; gap: 3px; }
    .swatch, .rainbow-sw { width: 20px; height: 20px; }
    .canvas-area { padding: 4px; }
  }
    </style>
</head>
<body>
    <div id="screen3" class="screen">

  <!-- TOP BAR: title + tools -->
  <div class="topbar">
    <div class="topbar-row1">
      <span id="bookEmoji" style="font-size:16px">✈️</span>
      <span id="bookTitle">Aeroplane</span>
    </div>
    <div class="topbar-row2">
      <div class="tb-left">
        <button class="back-btn" onclick="goToScreen2()">&#9664; Back</button>
        <button class="tool-btn active" id="brushBtn" onclick="setTool('brush')">🖌 <span class="tool-label">Brush</span></button>
        <button class="tool-btn" id="fillBtn" onclick="setTool('fill')">🪣 <span class="tool-label">Fill</span></button>
        <button class="tool-btn" onclick="undoAction()">↩ <span class="tool-label">Undo</span></button>
        <button class="tool-btn" onclick="clearCanvas()">⌫ <span class="tool-label">Clear</span></button>
      </div>
      <div class="tb-right">
        <div class="size-control">
          Size:
          <input type="range" min="2" max="40" value="10" step="1" id="sizeSlider" oninput="updateSize(this.value)">
          <span class="size-num" id="sizeVal">10</span>
        </div>
        <span class="page-num" id="pageNum">1 / 8</span>
      </div>
    </div>
  </div>

  <!-- CANVAS -->
  <div class="canvas-area">
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="colorCanvas"></canvas>
    </div>
  </div>

  <!-- BOTTOM BAR: single-line palette + Prev / dots / Save / Next -->
  <div class="bottom-bar">
    <!-- Color palette — single scrollable row -->
    <div class="palette-row" id="palette"></div>

    <!-- Navigation row -->
    <div class="nav-row">
      <!-- Prev — bottom left -->
      <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>&#9664; Prev</button>

      <!-- Page dots — center -->
      <div class="nav-center">
        <div class="page-dots" id="pageDots"></div>
      </div>

      <!-- Save + Next — bottom right -->
      <div class="nav-right">
        <button class="nav-btn save-btn" onclick="saveImage()">💾 Save</button>
        <button class="nav-btn primary" id="nextBtn" onclick="changePage(1)">Next &#9654;</button>
      </div>
    </div>
  </div>

</div>

// ─── PAGE IMAGE ───
const PAGE_IMG = new Image();
let pageImgLoaded = false;
PAGE_IMG.onload = () => { pageImgLoaded = true; drawPageContent(); };

function loadPageImage() {
  if (!currentBook) return;
  const imgs = BOOK_IMAGES[currentBook.name];
  if (!imgs) return;
  const src = imgs[currentPage - 1] || imgs[0];
  pageImgLoaded = false;
  PAGE_IMG.src = src;
}

function drawPageContent() {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (pageImgLoaded) {
    // Draw the template image scaled to fit the canvas, centered
    const iw = PAGE_IMG.naturalWidth;
    const ih = PAGE_IMG.naturalHeight;
    const cw = canvas.width;
    const ch = canvas.height;
    const scale = Math.min(cw / iw, ch / ih);
    const dw = iw * scale;
    const dh = ih * scale;
    const dx = (cw - dw) / 2;
    const dy = (ch - dh) / 2;
    ctx.drawImage(PAGE_IMG, dx, dy, dw, dh);
  }
}

// ─── DRAWING ───
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * scaleX,
    y: (src.clientY - rect.top) * scaleY
  };
}

function saveUndo() {
  if (undoStack.length > 30) undoStack.shift();
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
}

canvas.addEventListener('mousedown', e => { saveUndo(); isDrawing = true; const p = getPos(e); lastX=p.x; lastY=p.y; if(currentTool==='fill'){floodFill(Math.round(p.x),Math.round(p.y),currentColor);} });
canvas.addEventListener('mousemove', e => { if(!isDrawing||currentTool!=='brush') return; const p=getPos(e); draw(lastX,lastY,p.x,p.y); lastX=p.x; lastY=p.y; });
canvas.addEventListener('mouseup', () => { isDrawing=false; });
canvas.addEventListener('mouseleave', () => { isDrawing=false; });
canvas.addEventListener('touchstart', e => { e.preventDefault(); saveUndo(); isDrawing=true; const p=getPos(e); lastX=p.x; lastY=p.y; if(currentTool==='fill'){floodFill(Math.round(p.x),Math.round(p.y),currentColor);} }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); if(!isDrawing||currentTool!=='brush') return; const p=getPos(e); draw(lastX,lastY,p.x,p.y); lastX=p.x; lastY=p.y; }, {passive:false});
canvas.addEventListener('touchend', () => { isDrawing=false; });

function draw(x1,y1,x2,y2) {
  ctx.strokeStyle = currentColor;
  ctx.lineWidth = brushSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

// ─── FLOOD FILL ───
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function floodFill(startX, startY, fillColor) {
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  const idx = (startY * canvas.width + startX) * 4;
  const sr = data[idx], sg = data[idx+1], sb = data[idx+2], sa = data[idx+3];
  const [fr,fg,fb] = hexToRgb(fillColor);
  if (sr===fr && sg===fg && sb===fb) return;

  const stack = [[startX,startY]];
  const visited = new Uint8Array(canvas.width * canvas.height);

  function match(i) {
    return Math.abs(data[i]-sr)<30 && Math.abs(data[i+1]-sg)<30 && Math.abs(data[i+2]-sb)<30 && Math.abs(data[i+3]-sa)<30;
  }

  while (stack.length) {
    const [x,y] = stack.pop();
    if (x<0||x>=canvas.width||y<0||y>=canvas.height) continue;
    const vi = y*canvas.width+x;
    if (visited[vi]) continue;
    const i = vi*4;
    if (!match(i)) continue;
    visited[vi] = 1;
    data[i]=fr; data[i+1]=fg; data[i+2]=fb; data[i+3]=255;
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(imgData, 0, 0);
}

function undoAction() {
  if (undoStack.length === 0) return;
  ctx.putImageData(undoStack.pop(), 0, 0);
}

function clearCanvas() {
  saveUndo();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawPageContent();
}

function setTool(t) {
  currentTool = t;
  document.getElementById('brushBtn').classList.toggle('active', t==='brush');
  document.getElementById('fillBtn').classList.toggle('active', t==='fill');
  canvas.style.cursor = t==='fill' ? 'cell' : 'crosshair';
}

function updateSize(v) {
  brushSize = Math.round(v);
  document.getElementById('sizeVal').textContent = Math.round(v);
}

// ─── SAVE IMAGE ───
function saveImage() {
  const bookName = currentBook ? currentBook.name.replace(/\s+/g, '-').toLowerCase() : 'coloring';
  const now = new Date();
  const pad = (n, len) => String(n).padStart(len, '0');
  const timestamp = `_${now.getFullYear()}${pad(now.getMonth()+1,2)}${pad(now.getDate(),2)}${pad(now.getHours(),2)}${pad(now.getMinutes(),2)}${pad(now.getSeconds(),2)}${pad(now.getMilliseconds(),3)}`;
  const defaultName = `${bookName}-page${currentPage}${timestamp}`;
  showSaveDialog(defaultName);
}

function showSaveDialog(defaultName) {
  // Remove any existing dialog
  const existing = document.getElementById('saveDialog');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'saveDialog';
  overlay.style.cssText = `
    position:fixed;inset:0;background:rgba(0,0,0,0.55);
    display:flex;align-items:center;justify-content:center;
    z-index:9999;font-family:'Nunito',system-ui,sans-serif;
  `;

  overlay.innerHTML = `
    <div style="background:#fff;border-radius:18px;padding:28px 32px;width:320px;
                max-width:90vw;box-shadow:0 12px 40px rgba(0,0,0,0.25);text-align:center;">
      <div style="font-size:36px;margin-bottom:8px;">💾</div>
      <div style="font-size:18px;font-weight:800;color:#2d2d2d;margin-bottom:6px;">Save Your Coloring</div>
      <div style="font-size:13px;color:#999;margin-bottom:20px;">Enter a name for your file</div>
      <input id="saveFileName" type="text" value="${defaultName}"
        style="width:100%;border:2px solid #f0e8dc;border-radius:10px;padding:10px 14px;
               font-size:14px;font-family:'Nunito',system-ui,sans-serif;font-weight:700;
               color:#333;outline:none;box-sizing:border-box;text-align:center;"
        placeholder="Enter filename" />
      <div style="font-size:11px;color:#bbb;margin-top:6px;margin-bottom:20px;">.png will be added automatically</div>
      <div style="display:flex;gap:10px;justify-content:center;">
        <button onclick="document.getElementById('saveDialog').remove()"
          style="padding:10px 22px;border-radius:20px;border:1.5px solid #ddd;background:#f5f5f5;
                 font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',system-ui,sans-serif;color:#666;">
          Cancel
        </button>
        <button onclick="doSave()"
          style="padding:10px 22px;border-radius:20px;border:none;background:#22c55e;color:#fff;
                 font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',system-ui,sans-serif;">
          Save to Device
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  // Auto-select filename text
  const input = document.getElementById('saveFileName');
  setTimeout(() => { input.focus(); input.select(); }, 50);

  // Allow Enter key to confirm
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') doSave();
    if (e.key === 'Escape') overlay.remove();
  });

  // Click outside to cancel
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.remove();
  });
}

async function doSave() {
  const input = document.getElementById('saveFileName');
  let filename = (input ? input.value.trim() : '') || 'coloring';
  // Strip any .png the user may have typed
  filename = filename.replace(/\.png$/i, '');

  // Build the image blob
  const offscreen = document.createElement('canvas');
  offscreen.width = canvas.width;
  offscreen.height = canvas.height;
  const offCtx = offscreen.getContext('2d');
  offCtx.fillStyle = '#ffffff';
  offCtx.fillRect(0, 0, offscreen.width, offscreen.height);
  offCtx.drawImage(canvas, 0, 0);

  // Remove dialog
  const dialog = document.getElementById('saveDialog');
  if (dialog) dialog.remove();

  // Try File System Access API (shows native "Save As" picker in Chrome/Edge)
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename + '.png',
        types: [{ description: 'PNG Image', accept: { 'image/png': ['.png'] } }]
      });
      const blob = await new Promise(res => offscreen.toBlob(res, 'image/png'));
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      showToast('✅ Saved!');
      return;
    } catch (err) {
      // User cancelled the picker — don't fall through to download
      if (err.name === 'AbortError') return;
    }
  }

  // Fallback: standard browser download (triggers native Save As in most browsers)
  const link = document.createElement('a');
  link.download = filename + '.png';
  link.href = offscreen.toDataURL('image/png');
  link.click();
  showToast('✅ Download started!');
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
    background:#22c55e;color:#fff;padding:10px 24px;border-radius:30px;
    font-family:'Nunito',system-ui,sans-serif;font-weight:700;font-size:14px;
    box-shadow:0 4px 16px rgba(0,0,0,0.2);z-index:99999;
    animation:fadeUp 0.3s ease;
  `;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ─── PALETTE BUILD ───
function buildPalette() {
  const pal = document.getElementById('palette');
  pal.innerHTML = '';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (c===currentColor?' selected':'') + (c==='#FFFFFF'?' white-sw':'');
    sw.style.background = c;
    sw.onclick = () => {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
      currentColor = c;
    };
    pal.appendChild(sw);
  });
  const rb = document.createElement('div');
  rb.className = 'rainbow-sw';
  rb.title = 'Custom color';
  const picker = document.createElement('input');
  picker.type = 'color';
  picker.className = 'color-picker-input';
  picker.oninput = e => { currentColor = e.target.value; document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected')); };
  rb.appendChild(picker);
  pal.appendChild(rb);
}

// ─── PAGE DOTS ───
function buildDots(total, current) {
  const container = document.getElementById('pageDots');
  container.innerHTML = '';
  // Limit dots shown on small screens
  const maxDots = Math.min(total, 12);
  for (let i = 1; i <= maxDots; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i===current?' active':'');
    container.appendChild(d);
  }
}

function changePage(dir) {
  const total = currentBook.pages;
  currentPage = Math.min(Math.max(currentPage + dir, 1), total);
  document.getElementById('pageNum').textContent = currentPage + ' / ' + total;
  document.getElementById('prevBtn').disabled = currentPage === 1;
  document.getElementById('nextBtn').disabled = currentPage === total;
  buildDots(total, currentPage);
  undoStack = [];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  loadPageImage(currentPage);
}

// ─── BOOKS GRID ───
function buildBooksGrid() {
  const grid = document.getElementById('booksGrid');
  grid.innerHTML = '';
  books.forEach(book => {
    const card = document.createElement('div');
    card.className = 'book-card' + (book.locked ? ' locked' : '');
    card.innerHTML = `
      <div class="book-icon">${book.emoji}</div>
      <div class="book-name">${book.name}</div>
      <div class="book-pages">${book.locked ? '' : book.pages + ' pages'}</div>
      ${book.locked ? '<div class="lock-badge">🔒 Locked</div>' : ''}
    `;
    if (!book.locked) {
      card.onclick = () => openBook(book);
    }
    grid.appendChild(card);
  });
}

// ─── NAVIGATION ───
function goToScreen1() {
  document.getElementById('screen2').classList.remove('active');
  document.getElementById('screen3').classList.remove('active');
  document.getElementById('screen1').classList.add('active');
}

function goToScreen2() {
  document.getElementById('screen1').classList.remove('active');
  document.getElementById('screen3').classList.remove('active');
  document.getElementById('screen2').classList.add('active');
  buildBooksGrid();
}

function openBook(book) {
  currentBook = book;
  currentPage = 1;
  undoStack = [];
  document.getElementById('bookTitle').textContent = book.name;
  document.getElementById('bookEmoji').textContent = book.emoji;
  document.getElementById('screen2').classList.remove('active');
  document.getElementById('screen3').classList.add('active');

  // Switch aspect ratio: Alphabet = portrait (3:4), others = landscape (4:3)
  const wrapper = document.getElementById('canvasWrapper');
  if (book.name === 'Alphabet') {
    wrapper.style.aspectRatio = '3 / 4';
    wrapper.style.maxWidth = 'min(100%, calc((100vh - 160px) * 3 / 4))';
  } else {
    wrapper.style.aspectRatio = '4 / 3';
    wrapper.style.maxWidth = 'min(100%, calc((100vh - 160px) * 4 / 3))';
  }

  buildPalette();
  buildDots(book.pages, 1);
  document.getElementById('pageNum').textContent = '1 / ' + book.pages;
  document.getElementById('prevBtn').disabled = true;
  document.getElementById('nextBtn').disabled = book.pages === 1;

  // Give DOM time to render before sizing canvas
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      resizeCanvas();
      loadPageImage(1);
    });
  });
}

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  const sb = document.getElementById('sidebar');
  const btn = document.getElementById('collapseBtn');
  sb.classList.toggle('collapsed', !sidebarOpen);
  btn.innerHTML = sidebarOpen ? '&#9664;' : '&#9654;';
}

// ─── RESIZE HANDLER ───
let resizeTimer;
window.addEventListener('resize', () => {
  if (document.getElementById('screen3').classList.contains('active')) {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvas, 80);
  }
});

// Auto-open the Aeroplane book directly on load
window.addEventListener('DOMContentLoaded', () => {
  const aeroplaneBook = books.find(b => b.name === 'Aeroplane');
  if (aeroplaneBook) {
    currentBook = aeroplaneBook;
    currentPage = 1;
    undoStack = [];
    document.getElementById('bookTitle').textContent = aeroplaneBook.name;
    document.getElementById('bookEmoji').textContent = aeroplaneBook.emoji;
    document.getElementById('screen3').classList.add('active');

    const wrapper = document.getElementById('canvasWrapper');
    wrapper.style.aspectRatio = '4 / 3';
    wrapper.style.maxWidth = 'min(100%, calc((100vh - 160px) * 4 / 3))';

    buildPalette();
    buildDots(aeroplaneBook.pages, 1);
    document.getElementById('pageNum').textContent = '1 / ' + aeroplaneBook.pages;
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = aeroplaneBook.pages === 1;

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        resizeCanvas();
        loadPageImage(1);
      });
    });
  }
});
</script>
